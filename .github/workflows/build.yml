name: Build APK

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Decode signing key from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing repository secret KEYSTORE_BASE64"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Rename APK and create checksum
        run: |
          cp app/build/outputs/apk/release/app-release.apk DriveTunes.apk
          sha256sum DriveTunes.apk > DriveTunes.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: DriveTunes-apk
          path: DriveTunes.apk

      # Public release: shows up under "Releases" on the repo page, and the newest one is
      # always reachable at /releases/latest (and /releases/latest/download/DriveTunes.apk).
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: DriveTunes 1.0.${{ github.run_number }}
          body_path: .github/release-notes.md
          generate_release_notes: true
          make_latest: "true"
          files: |
            DriveTunes.apk
            DriveTunes.apk.sha256
